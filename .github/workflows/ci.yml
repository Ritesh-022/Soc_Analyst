# CI pipeline for Ascense.
# Runs on every push to main and every PR targeting main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Contract tests — validate JSON Schema and OpenAPI contracts
  # -------------------------------------------------------------------------
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run contract tests
        run: python -m pytest tests/contract/ -v --tb=short

  # -------------------------------------------------------------------------
  # Python lint — ruff only (mypy requires stubs for optional deps)
  # -------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint — ascense/
        run: python -m ruff check ascense/
      - name: Ruff lint — tests/
        run: python -m ruff check tests/

  # -------------------------------------------------------------------------
  # Unit + security tests — no database required
  # -------------------------------------------------------------------------
  python-unit-tests:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit, contract, and security tests
        run: python -m pytest tests/unit/ tests/security/ tests/contract/ -v --tb=short

  # -------------------------------------------------------------------------
  # Frontend build — TypeScript type-check + Vite build
  # -------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install npm dependencies
        run: npm install
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npm run build

  # -------------------------------------------------------------------------
  # Integration tests — database and broker services required
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ascense
          POSTGRES_PASSWORD: ascense_dev_password
          POSTGRES_DB: ascense
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: ascense
          RABBITMQ_DEFAULT_PASS: ascense_dev_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASCENSE_ENV: development
      DATABASE_URL: postgresql+asyncpg://ascense:ascense_dev_password@localhost:5432/ascense
      RABBITMQ_URL: amqp://ascense:ascense_dev_password@localhost:5672/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: |
          alembic upgrade head
      - name: Verify single migration head
        run: |
          head_count=$(alembic heads | wc -l)
          if [ "$head_count" -ne 1 ]; then
            echo "ERROR: Multiple Alembic heads detected:"
            alembic heads
            exit 1
          fi
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short
      - name: Run tenant isolation tests
        run: python -m pytest tests/integration/test_tenant_isolation.py -v --tb=short
