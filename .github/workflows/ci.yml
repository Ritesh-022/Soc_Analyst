# CI pipeline for Ascense.
# Runs on every push to main and every PR targeting main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Contract tests — validate JSON Schema and OpenAPI contracts
  # -------------------------------------------------------------------------
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run contract tests
        run: python -m pytest tests/contract/ -v --tb=short

  # -------------------------------------------------------------------------
  # Python lint — ruff only (mypy requires stubs for optional deps)
  # -------------------------------------------------------------------------
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint — ascense/
        run: python -m ruff check ascense/
      - name: Ruff lint — tests/
        run: python -m ruff check tests/

  # -------------------------------------------------------------------------
  # Unit + security tests — no database required
  # -------------------------------------------------------------------------
  python-unit-tests:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit, contract, and security tests
        run: python -m pytest tests/unit/ tests/security/ tests/contract/ -v --tb=short

  # -------------------------------------------------------------------------
  # Frontend build — TypeScript type-check + Vite build
  # -------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install npm dependencies
        run: npm install
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npm run build
