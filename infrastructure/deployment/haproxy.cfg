global
    log stdout format raw local0
    ssl-default-bind-min-ver TLSv1.2
    ssl-default-server-min-ver TLSv1.2

defaults
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend gateway_https
    bind :8443 ssl crt /etc/haproxy/certs/gateway-server.pem \
        ca-file /etc/haproxy/certs/gateway-ca.pem verify required

    # Never preserve a client-supplied identity header. Encode the verified
    # leaf certificate's DER bytes exactly once for the API contract.
    http-request del-header X-Client-Cert
    http-request set-header X-Client-Cert %[ssl_c_der,base64]

    default_backend ascense_api

backend ascense_api
    # The API is reachable only on the private network and authenticates this
    # proxy with an internal client certificate.
    server api ascense-api:8000 ssl verify required \
        ca-file /etc/haproxy/certs/api-ca.pem \
        crt /etc/haproxy/certs/proxy-client.pem
