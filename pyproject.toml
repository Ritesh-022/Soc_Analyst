[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ascense"
version = "0.1.0"
description = "Ascense autonomous cyber defense platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ascense" }]

dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b",
    "aio-pika>=9.4",
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ascense"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "S"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring a live database",
    "security: marks security/negative-case tests",
    "requires_stack: marks tests needing the full Docker stack",
]
